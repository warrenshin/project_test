name: investment-learning-app API CI

on:
  push:
    branches: [main]
    paths:
      - "investment-learning-app/apps/api/**"
  pull_request:
    paths:
      - "investment-learning-app/apps/api/**"

defaults:
  run:
    working-directory: investment-learning-app/apps/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Import check
        run: python -c "from app.main import app; print(len(app.routes), 'routes registered')"
      - name: Run tests
        run: pytest -q
