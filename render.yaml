databases:
  - name: investment-learning-db
    databaseName: investment_learning
    user: investment_learning
    plan: free

services:
  - type: web
    name: investment-learning-api
    runtime: docker
    plan: free
    dockerfilePath: ./investment-learning-app/apps/api/Dockerfile
    dockerContext: ./investment-learning-app/apps/api
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: investment-learning-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: MARKET_DATA_PROVIDER
        value: demo
      # Vercel 배포 후 실제 웹앱 URL로 반드시 교체해야 한다(쉼표로 여러 개
      # 나열 가능) — 이 값이 비어 있거나 실제 프런트엔드 origin과 다르면
      # 브라우저가 CORS로 모든 API 요청을 막는다.
      - key: CORS_ALLOWED_ORIGINS_RAW
        value: "https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app"
